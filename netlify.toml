[build]
  publish = "."
  functions = "netlify/functions"

# Nothing here is meant to be found, only handed out.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The bare address goes to what is on, which is the page anyone might arrive
# at. The rota and the roster are reached from there, or by a personal link.
[[redirects]]
  from = "/"
  to = "/events"
  status = 302
